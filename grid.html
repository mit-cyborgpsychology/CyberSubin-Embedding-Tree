<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Compare six Cyber Subin Thai traditional dance avatars and movement visualizations in a synchronized 3 by 2 grid."
    />
    <title>Cyber Subin 2.0 Lab — Six Avatar Grid</title>
  </head>
  <body>
    <main class="grid-app">
      <header class="grid-topbar">
        <a class="grid-brand" href="/" aria-label="Return to the single-avatar view">
          <strong>CYBER SUBIN 2.0 LAB</strong>
        </a>

        <div class="grid-topbar-spacer" aria-hidden="true"></div>

        <nav class="view-switcher" aria-label="View navigation">
          <div class="nav-utility-group" aria-label="Grid and display utilities">
            <button id="reset-all" class="nav-action nav-action--reset" type="button">RESET ALL</button>
            <button id="hide-control-buttons" class="nav-action" type="button" aria-pressed="false">HIDE BUTTONS</button>
            <button id="hide-all-ui" class="nav-action" type="button" aria-pressed="false">PRESENTATION MODE</button>
          </div>
          <div class="nav-view-group" aria-label="Choose view">
            <a id="single-view-link" class="view-tab" href="/">SINGLE VIEW</a>
            <a class="view-tab active" href="/grid.html" aria-current="page">GRID VIEW</a>
            <a class="view-tab" href="/element-embedding.html">ELEMENT MAP</a>
            <a class="view-tab" href="/element-embedding-3d.html">3D MAP</a>
          </div>
        </nav>
      </header>

      <section class="global-controls" aria-label="Controls for all six avatars">
        <div class="global-control-group">
          <label for="global-avatar">AVATAR FOR ALL SIX</label>
          <select id="global-avatar" aria-label="Select one avatar for all six cells"></select>
          <button id="apply-avatar-all" type="button">SAME AVATAR ×6</button>
          <button id="random-avatar-all" type="button">RANDOM 1–59</button>
        </div>

        <div class="global-control-group global-control-group--effect">
          <label for="global-effect">EFFECT FOR ALL SIX</label>
          <select id="global-effect" aria-label="Select one effect for all six cells"></select>
          <button id="apply-effect-all" type="button">SAME EFFECT ×6</button>
          <button id="distribute-effects" type="button">NO.60 1→6</button>
        </div>

        <div class="global-control-group global-control-group--master" aria-label="Master settings controls">
          <span>MASTER · CELL 01</span>
          <button id="edit-master-settings" type="button">EDIT MASTER</button>
          <button id="apply-settings-all" type="button">APPLY SETTINGS ×6</button>
        </div>
      </section>

      <section id="avatar-grid" class="avatar-grid" aria-label="Six avatar comparison grid"></section>

      <footer class="grid-transport" aria-label="Controls for synchronized animation playback">
        <button id="play-all" class="play-all" type="button" aria-label="Pause all animations">PAUSE ALL</button>

        <div class="grid-timecode">
          <span id="grid-current-time">00:00.00</span>
          <small id="grid-total-time">/ 00:00.00</small>
        </div>

        <div class="grid-timeline-wrap">
          <input
            id="grid-timeline"
            type="range"
            min="0"
            max="1"
            value="0"
            step="0.001"
            aria-label="Six-avatar animation timeline"
          />
          <div class="grid-timeline-marks" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
        </div>

        <div class="grid-speed-control" aria-label="Six-avatar playback speed">
          <span>SPEED</span>
          <details id="grid-speed-menu" class="grid-speed-menu">
            <summary aria-label="Choose six-avatar playback speed">
              <strong id="grid-speed-value">3×</strong>
              <span class="grid-speed-menu__chevron" aria-hidden="true">⌃</span>
            </summary>
            <div class="grid-speed-menu__options" role="radiogroup" aria-label="Six-avatar playback speed options">
              <button type="button" role="radio" aria-checked="false" data-grid-speed="0.05">0.05×</button>
              <button type="button" role="radio" aria-checked="false" data-grid-speed="0.1">0.1×</button>
              <button type="button" role="radio" aria-checked="false" data-grid-speed="0.5">0.5×</button>
              <button type="button" role="radio" aria-checked="false" data-grid-speed="1">1×</button>
              <button type="button" role="radio" aria-checked="false" data-grid-speed="1.5">1.5×</button>
              <button type="button" role="radio" aria-checked="false" data-grid-speed="2">2×</button>
              <button type="button" role="radio" aria-checked="true" data-grid-speed="3" class="active">3×</button>
              <button type="button" role="radio" aria-checked="false" data-grid-speed="4">4×</button>
              <button type="button" role="radio" aria-checked="false" data-grid-speed="5">5×</button>
              <button type="button" role="radio" aria-checked="false" data-grid-speed="10">10×</button>
              <button type="button" role="radio" aria-checked="false" data-grid-speed="20">20×</button>
              <button type="button" role="radio" aria-checked="false" data-grid-speed="50">50×</button>
            </div>
          </details>
        </div>

        <button id="restart-all" class="restart-all" type="button">RESTART ALL</button>
      </footer>
    </main>

    <script type="module" src="/src/grid.js"></script>
  </body>
</html>
