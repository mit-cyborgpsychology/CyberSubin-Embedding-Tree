<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>3D Evolutionary Motion Tree · CyberSubin</title>
  <script type="module" src="./vendor/model-viewer/model-viewer.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --a: #55e6d9;
      --b: #ff9b54;
      --c: #8ca8ff;
      --d: #e486e1;
      --e: #a7e06e;
      --f: #ffd75f;
      --line: #4a4a4a;
      --muted: #c9c9c9;
      font-family: system-ui, -apple-system, "Thonburi", sans-serif;
      color: #fff;
      background: #000;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    button, a { font: inherit; -webkit-tap-highlight-color: transparent; }
    .app { position: relative; width: 100vw; height: 100dvh; min-height: 540px; overflow: hidden; background: #000; }
    .visually-hidden { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .actions { position: absolute; z-index: 50; top: 14px; right: 18px; display: flex; border: 1px solid var(--line); background: rgba(0,0,0,.9); box-shadow: 0 12px 34px rgba(0,0,0,.62); backdrop-filter: blur(12px); }
    .actions button, .actions a {
      min-height: 32px; padding: 7px 9px; border: 0; border-right: 1px solid var(--line);
      background: transparent; color: #fff; font: 8px ui-monospace, "SFMono-Regular", Menlo, monospace;
      text-decoration: none; text-transform: uppercase; white-space: nowrap; cursor: pointer;
    }
    .actions > :last-child { border-right: 0; }
    .actions button:hover, .actions a:hover { background: #fff; color: #000; }
    .actions #flat-graph[aria-pressed="true"] { background: #fff; color: #000; }
    .actions button:disabled { color: #777; cursor: wait; }
    .actions button:focus-visible, .actions a:focus-visible { outline: 2px solid #fff; outline-offset: -3px; }
    .scene {
      position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
      background: radial-gradient(circle at 50% 58%, rgba(255,255,255,.065), transparent 43%), #000;
    }
    .scene.rotating { cursor: grabbing; }
    .tree, .avatars { position: absolute; inset: 0; width: 100%; height: 100%; }
    .tree { z-index: 1; overflow: visible; pointer-events: none; }
    .avatars { z-index: 2; pointer-events: none; }
    .guide { fill: none; stroke: rgba(255,255,255,.14); stroke-width: 1; stroke-dasharray: 4 6; }
    .guide.ground { stroke: rgba(255,255,255,.28); stroke-dasharray: none; }
    #guides { transition: opacity .35s ease; }
    .growing #guides, .flat-view #guides { opacity: 0; }
    .edge { fill: none; stroke: var(--color); stroke-width: var(--width,3px); stroke-linecap: round; stroke-linejoin: round; opacity: .72; transition: opacity .14s, stroke .14s, stroke-width .14s; pointer-events: stroke; cursor: pointer; }
    .edge.muted { opacity: .1; }
    .edge.group { stroke: var(--active); stroke-width: calc(var(--width,3px) + 2px); opacity: 1; }
    .edge.path { stroke: #fff; stroke-width: calc(var(--width,3px) + 4px); opacity: 1; }
    .edge.editing { stroke: #fff; stroke-width: calc(var(--width,3px) + 3px); opacity: 1; }
    .edge-label { fill: #fff; stroke: #000; stroke-width: 3px; paint-order: stroke fill; font: 10px ui-monospace, "SFMono-Regular", Menlo, monospace; text-anchor: middle; dominant-baseline: central; pointer-events: auto; cursor: pointer; user-select: none; }
    .edge-label:hover, .edge-label.selected { fill: #ffd75f; font-size: 13px; font-weight: 700; }
    .flat-view .edge, .flat-view .edge-label { pointer-events: none; cursor: default; }
    .node { fill: var(--color); stroke: #000; stroke-width: 1.5; opacity: .9; transition: opacity .14s, fill .14s; }
    .node.muted { opacity: .14; }
    .node.group { fill: var(--active); opacity: 1; }
    .node.path { fill: #fff; opacity: 1; }
    .avatar {
      --color: #fff; --scale: 1; position: absolute; width: 70px; height: 104px; padding: 0;
      transform: translate(-50%,-50%) scale(var(--scale)); transform-origin: center;
      border: 0; background: transparent; pointer-events: auto; cursor: pointer;
      transition: opacity .14s, filter .14s;
    }
    .avatar model-viewer { width: 100%; height: 100%; background: transparent; --progress-bar-color: var(--color); pointer-events: none; }
    .avatar::after {
      content: attr(data-id); position: absolute; left: 50%; bottom: -5px; min-width: 25px;
      padding: 2px 4px; transform: translateX(-50%); border: 1px solid var(--color);
      background: rgba(0,0,0,.9); color: #fff; font: 12px/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
    }
    .avatar:hover, .avatar:focus-visible, .avatar.selected { z-index: 5000 !important; filter: drop-shadow(0 0 9px var(--color)); }
    .avatar:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .avatar.selected::before { content: ""; position: absolute; inset: -4px; border: 2px solid var(--color); border-radius: 50%; }
    .avatar.muted { opacity: .09; }
    .avatar.offscreen { display: none; }
    .hide-labels .avatar::after, .hide-labels .edge-label { display: none; }
    .flat-view .avatar::after, .flat-view .edge-label,
    .growing .avatar::after, .growing .edge-label { display: none; }
    .branches-only .avatars, .branches-only #guides, .branches-only #nodes, .branches-only .branch-nav, .branches-only .note { display: none !important; }
    .branch-editor {
      position: absolute; z-index: 45; top: 58px; right: 18px; width: 292px;
      border: 1px solid rgba(255,255,255,.48); background: rgba(0,0,0,.93); color: #fff;
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; backdrop-filter: blur(12px);
      box-shadow: 0 14px 38px rgba(0,0,0,.7); cursor: default; touch-action: auto;
    }
    .branch-editor[hidden] { display: none; }
    .branch-editor-head { min-height: 34px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .branch-editor-head strong { padding: 0 10px; font-size: 11px; text-transform: uppercase; }
    .branch-editor button { min-height: 32px; border: 0; border-left: 1px solid var(--line); background: transparent; color: #fff; font: 9px ui-monospace, "SFMono-Regular", Menlo, monospace; text-transform: uppercase; cursor: pointer; }
    .branch-editor button:hover { background: #fff; color: #000; }
    .branch-close { width: 34px; font-size: 15px !important; }
    .branch-fields { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; padding: 10px; }
    .branch-fields label { display: grid; gap: 4px; color: var(--muted); font-size: 8px; text-transform: uppercase; }
    .branch-fields input { width: 100%; min-width: 0; height: 30px; padding: 4px 7px; border: 1px solid var(--line); border-radius: 0; background: #080808; color: #fff; font: 11px ui-monospace, "SFMono-Regular", Menlo, monospace; }
    .branch-fields input:focus { outline: 1px solid #fff; outline-offset: 1px; }
    .branch-editor-foot { min-height: 33px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); }
    .branch-editor-foot span { padding: 0 10px; color: var(--muted); font-size: 7px; text-transform: uppercase; }
    .branch-editor-foot button { padding: 0 10px; }
    .branch-nav, .note, .error {
      position: absolute; z-index: 30; border: 1px solid rgba(255,255,255,.4);
      background: rgba(0,0,0,.9); color: #fff; backdrop-filter: blur(10px);
    }
    .branch-nav { left: 28px; bottom: 43px; min-height: 34px; display: flex; align-items: stretch; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
    .branch-nav > span, .branch-nav output { min-height: 32px; padding: 0 9px; display: flex; align-items: center; color: var(--muted); font-size: 7px; text-transform: uppercase; white-space: nowrap; }
    .branch-nav > span { border-right: 1px solid var(--line); }
    .branch-nav output { min-width: 100px; border-left: 1px solid var(--line); }
    .groups { display: flex; }
    .branch-nav button { min-width: 32px; min-height: 32px; padding: 0 8px; border: 0; border-right: 1px solid var(--line); background: transparent; color: #fff; font: 8px ui-monospace, "SFMono-Regular", Menlo, monospace; text-transform: uppercase; cursor: pointer; }
    .branch-nav button:hover { background: rgba(255,255,255,.16); }
    .branch-nav button[aria-pressed="true"] { background: var(--group-color,#fff); color: #000; }
    .group-button { position: relative; padding-left: 18px !important; }
    .group-button::before { content:""; position:absolute; left:7px; top:50%; width:6px; height:12px; transform:translateY(-50%); background:var(--group-color); }
    .group-button[aria-pressed="true"]::before { background:#000; }
    .note { left: 28px; bottom: 13px; margin: 0; padding: 4px 7px; border-color: rgba(255,255,255,.22); color: var(--muted); font: 7px ui-monospace, "SFMono-Regular", Menlo, monospace; text-transform: uppercase; }
    .error { left: 50%; top: 50%; width: min(420px,calc(100vw - 40px)); padding: 20px; transform: translate(-50%,-50%); text-align: center; }
    .error[hidden] { display: none; }
    .error strong, .error span { display: block; }
    .error strong { font: 300 25px Georgia, serif; }
    .error span { margin-top: 5px; color: var(--muted); font-size: 11px; }
    @media (max-width: 700px) {
      .actions { left:8px;right:8px;top:8px;width:auto;justify-content:stretch; }
      .actions>* { flex:1;padding:6px 2px!important;text-align:center;font-size:6px!important; }
      .branch-nav { left:8px;right:8px;bottom:42px;overflow:hidden; }
      .branch-nav>span,.branch-nav output { display:none; }
      .groups { flex:1; }
      .branch-nav button { min-width:27px;padding:0 4px; }
      .group-button { flex:1;padding-left:12px!important; }
      .group-button::before { left:4px;width:5px; }
      .note { display:none; }
      .avatar { width:58px;height:88px; }
      .branch-editor { top: 49px; right: 8px; width: 250px; }
    }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after{transition-duration:.01ms!important} }
  </style>
</head>
<body>
  <main id="app" class="app" aria-busy="true">
    <nav class="actions" aria-label="3D tree actions">
      <button id="play" type="button" aria-pressed="true">Pause all</button>
      <button id="labels" type="button" aria-pressed="true">Hide labels</button>
      <button id="reset" type="button">Reset view</button>
      <button id="flat-graph" type="button" aria-pressed="false">2D graph</button>
      <button id="growth-animation" type="button">2D → 3D</button>
      <button id="rotate-camera" type="button">Rotate 90°</button>
      <button id="branches-only" type="button" aria-pressed="false">Branches only</button>
      <button id="export-layout" type="button">Export layout</button>
      <button id="import-layout" type="button">Load layout</button>
      <input id="layout-file" class="visually-hidden" type="file" accept="application/json,.json" />
      <a href="circular-tree.html">2D tree</a>
      <a href="avatar-map.html">Embedding</a>
    </nav>
    <output id="summary" class="visually-hidden" aria-live="polite">Loading hierarchy…</output>
    <section id="scene" class="scene" aria-label="Rotatable three-dimensional motion lineage">
      <svg id="tree" class="tree" role="img" aria-label="Projected three-dimensional phylogenetic tree"><g id="guides"></g><g id="edges"></g><g id="nodes"></g><g id="edge-labels"></g></svg>
      <div id="avatars" class="avatars"></div>
      <aside id="branch-editor" class="branch-editor" aria-label="Selected branch editor" hidden>
        <div class="branch-editor-head"><strong id="branch-title">Branch</strong><button id="branch-close" class="branch-close" type="button" aria-label="Close branch editor">×</button></div>
        <div class="branch-fields">
          <label>X rotation (°)<input id="branch-x" type="number" min="-180" max="180" step="1" value="0" /></label>
          <label>Y rotation (°)<input id="branch-y" type="number" min="-180" max="180" step="1" value="0" /></label>
          <label>Z rotation (°)<input id="branch-z" type="number" min="-180" max="180" step="1" value="0" /></label>
          <label>Length<input id="branch-length" type="number" min="0.1" step="0.1" value="1" /></label>
        </div>
        <div class="branch-editor-foot"><span>Edits move descendants</span><button id="branch-reset" type="button">Reset branch</button></div>
      </aside>
      <output id="panel" class="visually-hidden" aria-live="polite">Tree-like organic lineage</output>
      <nav class="branch-nav" aria-label="Branch navigation"><span>Highlight branch</span><button id="previous" type="button" aria-label="Previous branch">←</button><div id="groups" class="groups"></div><button id="next" type="button" aria-label="Next branch">→</button><button id="all" type="button" aria-pressed="true">All</button><output id="branch-status">All branches</output></nav>
      <p class="note">The crown rises and fans around the trunk; leaders arc upward while lateral growth spirals into three-dimensional space.</p>
    </section>
    <div id="error" class="error" hidden><strong>The hierarchy could not load.</strong><span id="error-detail"></span></div>
  </main>

    const DEFAULT_BRANCH_OVERRIDE_BY_ID = new Map(DEFAULT_BRANCH_LAYOUT.map(([id,rx,ry,rz,length])=>[id,{rx,ry,rz,length}]));
    const el = Object.fromEntries(["app","summary","play","labels","reset","flat-graph","growth-animation","rotate-camera","branches-only","export-layout","import-layout","layout-file","scene","tree","guides","edges","nodes","edge-labels","avatars","branch-editor","branch-title","branch-close","branch-x","branch-y","branch-z","branch-length","branch-reset","panel","previous","groups","next","all","branch-status","error","error-detail"].map(id => [id.replace(/-([a-z])/g,(_,c)=>c.toUpperCase()), document.getElementById(id)]));
    const s = { movements:[], movementById:new Map(), nodes:new Map(), positions:new Map(), basePositions:new Map(), flatPositions:new Map(), growthTargetPositions:new Map(), growthOrderDelays:new Map(), growthFinalYRanks:new Map(), growthTrunkStartScreenY:new Map(), growthTrunkTargetScreenY:new Map(), growthFitStart:1, growthFitTarget:1, growthTipStart:.4, headings:new Map(), children:new Map(), targets:new Map(), depths:new Map(), leaderChildByParent:new Map(), trunkChildByParent:new Map(), trunkSideByNode:new Map(), launchAzimuthByNode:new Map(), launchVectorByNode:new Map(), fibonacciPhaseByNode:new Map(), branchOverrides:new Map(), branchById:new Map(), selectedBranch:null, branchesOnly:false, flatMode:false, growthActive:false, growthProgress:1, trunkTip:null, tipPositions:[], leafOrder:[], maxDepth:0, maxHeight:1, clusters:[], clusterByMovement:new Map(), clusterByNode:new Map(), edgeItems:[], edgeLabelItems:[], nodeItems:[], guideItems:[], avatars:[], loaded:0, failed:0, playing:true, labels:true, selected:null, active:-1, yaw:DEFAULT_YAW, pitch:-.3, zoom:1, fitBase:1, width:1, height:1, pointer:null, px:0, py:0, root:null, projectionFrame:null, trackingFrame:null, cameraRotationFrame:null, growthFrame:null, orbitFrame:null, orbitLast:0 };
