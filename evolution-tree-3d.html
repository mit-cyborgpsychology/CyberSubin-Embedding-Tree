<!doctype html>
<html lang="en">
<head>

  <title>3D Evolutionary Motion Tree · CyberSubin</title>
  <script type="module" src="./vendor/model-viewer/model-viewer.min.js"></script>
  <style>
    :root {

      --a: #55e6d9;
      --b: #ff9b54;
      --c: #8ca8ff;

      --muted: #c9c9c9;
      font-family: system-ui, -apple-system, "Thonburi", sans-serif;

      background: #000;

    button, a { font: inherit; -webkit-tap-highlight-color: transparent; }
    .app { position: relative; width: 100vw; height: 100dvh; min-height: 540px; overflow: hidden; background: #000; }
    .visually-hidden { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .actions { position: absolute; z-index: 50; top: 14px; right: 18px; display: flex; border: 1px solid var(--line); background: rgba(0,0,0,.9); box-shadow: 0 12px 34px rgba(0,0,0,.62); backdrop-filter: blur(12px); }

      background: transparent; color: #fff; font: 8px ui-monospace, "SFMono-Regular", Menlo, monospace;
      text-decoration: none; text-transform: uppercase; white-space: nowrap; cursor: pointer;
    }
    .actions > :last-child { border-right: 0; }
    .actions button:hover, .actions a:hover { background: #fff; color: #000; }
    .actions button:focus-visible, .actions a:focus-visible { outline: 2px solid #fff; outline-offset: -3px; }
    .scene {

    .tree, .avatars { position: absolute; inset: 0; width: 100%; height: 100%; }

<body>

  </main>
  <script>
  (() => {

    async function initialize() {

    function bind() {
      el.play.addEventListener("click", togglePlay);
      el.labels.addEventListener("click", toggleLabels);
      el.reset.addEventListener("click", reset);
      el.previous.addEventListener("click", () => step(-1));
      el.next.addEventListener("click", () => step(1));
      el.all.addEventListener("click", () => activate(-1));
      el.scene.addEventListener("pointerdown", down);
      el.scene.addEventListener("pointermove", move);
      el.scene.addEventListener("pointerup", up);
      el.scene.addEventListener("pointercancel", up);
      el.scene.addEventListener("wheel", wheel, { passive:false });
      window.addEventListener("resize", resize);
    }

    function waitForViewer() {
      return Promise.race([
        customElements.whenDefined("model-viewer").then(() => customElements.get("model-viewer")),
        new Promise(resolve => setTimeout(() => resolve(null), 10000))

    function makeClusters(tree) {

    }

    function makePositions(tree) {

      s.children.clear();s.targets.clear();s.positions.clear();s.headings.clear();s.leaderChildByParent.clear();s.trunkSideByNode.clear();s.depths=new Map([[tree.root,0]]);
      s.nodes.forEach(n=>{if(n.parent){if(!s.children.has(n.parent))s.children.set(n.parent,[]);s.children.get(n.parent).push(n.id);}});

        if(n.type==="movement")return;
        const p=n.members.reduce((o,id)=>{const q=leafTargets.get(id);o.x+=q.x;o.z+=q.z;return o;},{x:0,z:0});p.x/=n.members.length;p.z/=n.members.length;s.targets.set(n.id,p);

    function makeGuides() {

    }

    function makeGroupButtons() {
      s.clusters.forEach(c=>{const b=document.createElement("button");b.type="button";b.className="group-button";b.dataset.index=c.index;b.style.setProperty("--group-color",c.color);b.setAttribute("aria-pressed","false");b.textContent=`${c.label} · ${c.members.length}`;b.addEventListener("click",()=>activate(s.active===c.index?-1:c.index));el.groups.appendChild(b);});
    }

    function makeAvatars(order) {
      const fragment=document.createDocumentFragment();
      order.forEach(id=>{
        const m=s.movementById.get(id),c=s.clusterByMovement.get(id),button=document.createElement("button"),viewer=document.createElement("model-viewer");
        button.type="button";button.className="avatar";button.dataset.id=String(id).padStart(2,"0");button.style.setProperty("--color",c.color);button.title=`${id}. ${m.thai} — ${m.english}`;button.setAttribute("aria-label",button.title);button.addEventListener("click",event=>{event.stopPropagation();select(id);});
        configure(viewer,m);const item={m,c,button,viewer,p:s.positions.get(`m${id}`),centerIndex:-1,settled:false};
        viewer.addEventListener("load",()=>{if(!item.settled){item.settled=true;record(false);}viewer.timeScale=SPEED;viewer.currentTime=m.skeleton?.calibration_time_seconds||0;calibrate(item);viewer.jumpCameraToGoal?.();s.playing?viewer.play?.():viewer.pause?.();});
        viewer.addEventListener("error",()=>{if(!item.settled){item.settled=true;record(true);}});
        viewer.setAttribute("src",m.glb);button.appendChild(viewer);fragment.appendChild(button);s.avatars.push(item);
      });
      el.avatars.appendChild(fragment);requestProjection();setTimeout(()=>{if(!s.loaded&&!s.failed)el.panel.innerHTML="<strong>Tree loaded; avatars are still starting.</strong><span>The branch structure is ready and rotatable.</span>";},12000);
    }

    function configure(v,m) {

      const size=m.skeleton?.calibration_head_to_hips_distance||m.skeleton?.head_to_hips_distance||66.2,distance=size*6.25;
      v.setAttribute("camera-orbit",`0deg 82deg ${distance.toFixed(3)}m`);v.setAttribute("min-camera-orbit",`auto auto ${distance.toFixed(3)}m`);v.setAttribute("max-camera-orbit",`auto auto ${distance.toFixed(3)}m`);v.setAttribute("field-of-view","35deg");v.setAttribute("min-field-of-view","35deg");v.setAttribute("max-field-of-view","35deg");v.setAttribute("interpolation-decay","0");
      const center=m.skeleton?.calibration_center;if(center?.length===3)v.setAttribute("camera-target",`${center[0]}m ${center[1]}m ${center[2]}m`);v.setAttribute("alt",`${m.english}, animated Thai dance avatar`);
    }

    function resize(){s.width=el.scene.clientWidth||1;s.height=el.scene.clientHeight||1;el.tree.setAttribute("viewBox",`0 0 ${s.width} ${s.height}`);requestProjection();}
    function requestProjection(){if(s.projectionFrame)return;s.projectionFrame=requestAnimationFrame(()=>{s.projectionFrame=null;projectAll();});}
    function projectAll(){
      s.guideItems.forEach(g=>g.path.setAttribute("d",g.points.map((p,i)=>{const q=project(p);return`${i?"L":"M"}${round(q.x)} ${round(q.y)}`;}).join(" ")));
      s.edgeItems.forEach(e=>e.line.setAttribute("d",e.points.map((p,i)=>{const q=project(p);return`${i?"L":"M"}${round(q.x)} ${round(q.y)}`;}).join(" ")));
      s.nodeItems.forEach(n=>{const q=project(n.p);n.circle.setAttribute("cx",round(q.x));n.circle.setAttribute("cy",round(q.y));n.circle.setAttribute("r",round(n.r*clamp(q.scale,.68,1.25)));});
      s.avatars.forEach(a=>{const q=project(a.p),visible=q.x>-80&&q.x<s.width+80&&q.y>-120&&q.y<s.height+120&&q.depth>-CAMERA+2;a.button.classList.toggle("offscreen",!visible);if(!visible)return;const scale=clamp(q.scale*(.9+s.zoom*.1),.56,1.3);a.button.style.left=`${round(q.x)}px`;a.button.style.top=`${round(q.y-42*scale)}px`;a.button.style.setProperty("--scale",scale.toFixed(3));a.button.style.zIndex=String(1000-Math.round(q.depth*10));});
    }
    function project(p){const cy=Math.cos(s.yaw),sy=Math.sin(s.yaw),x=p.x*cy-p.z*sy,z=p.x*sy+p.z*cy,cp=Math.cos(s.pitch),sp=Math.sin(s.pitch),y=p.y*cp-z*sp,depth=p.y*sp+z*cp,perspective=clamp(CAMERA/(CAMERA+depth),.52,1.7),base=Math.min(s.width/48,Math.max(7.2,(s.height-160)/41))*s.zoom;return{x:s.width/2+x*base*perspective,y:s.height*.92-y*base*perspective,depth,scale:perspective};}

    function down(event){if(event.button!==0||event.target.closest("button,a"))return;s.pointer=event.pointerId;s.px=event.clientX;s.py=event.clientY;el.scene.setPointerCapture?.(event.pointerId);el.scene.classList.add("rotating");}
    function move(event){if(s.pointer!==event.pointerId)return;s.yaw+=(event.clientX-s.px)*.007;s.pitch=clamp(s.pitch+(event.clientY-s.py)*.0045,-.62,.42);s.px=event.clientX;s.py=event.clientY;requestProjection();}
    function up(event){if(s.pointer!==event.pointerId)return;el.scene.releasePointerCapture?.(event.pointerId);el.scene.classList.remove("rotating");s.pointer=null;}
    function wheel(event){if(event.target.closest("button,a"))return;event.preventDefault();s.zoom=clamp(s.zoom*Math.exp(-event.deltaY*.0012),.55,2.3);requestProjection();}
    function reset(){s.yaw=DEFAULT_YAW;s.pitch=-.18;s.zoom=1;requestProjection();}

    function select(id){s.selected=id;const m=s.movementById.get(id),c=s.clusterByMovement.get(id),depth=s.depths.get(`m${id}`);s.active=c.index;updateNav();highlight();el.panel.innerHTML=`<strong>${String(id).padStart(2,"0")} · <span lang="th">${escape(m.thai)}</span></strong><span>${escape(m.english)} · ${depth} branching steps from the shared root</span>`;}
    function activate(index){s.active=index<0?-1:(index+s.clusters.length)%s.clusters.length;s.selected=null;updateNav();highlight();const c=s.clusters[s.active];el.panel.innerHTML=c?`<strong>Branch group ${c.label}</strong><span>${c.members.length} observed movements branching from the tree-like backbone</span>`:"<strong>Tree-like organic lineage</strong><span>Ten-level vertical trunk · strongly separated organic crown · drag to rotate</span>";}
    function step(direction){activate(s.active<0?(direction>0?0:s.clusters.length-1):(s.active+direction+s.clusters.length)%s.clusters.length);}
    function updateNav(){const c=s.clusters[s.active]||null;el.groups.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(Number(b.dataset.index)===s.active)));el.all.setAttribute("aria-pressed",String(!c));el.all.style.setProperty("--group-color","#fff");el.branchStatus.textContent=c?`Group ${c.label} · ${c.members.length} dances`:"All branches";}
    function pathFor(id){const set=new Set();let n=id==null?null:s.nodes.get(`m${id}`);while(n?.parent){set.add(n.id);n=s.nodes.get(n.parent);}return set;}
    function highlight(){const c=s.clusters[s.active]||null,path=pathFor(s.selected);s.edgeItems.forEach(e=>{const p=path.has(e.id),g=!!c?.path.has(e.id);e.line.style.setProperty("--active",c?.color||"#fff");e.line.classList.toggle("path",p);e.line.classList.toggle("group",g);e.line.classList.toggle("muted",!!c&&!g&&!p);});s.nodeItems.forEach(n=>{const p=path.has(n.id)||(s.selected!=null&&n.root),g=!!c&&(c.path.has(n.id)||n.root);n.circle.style.setProperty("--active",c?.color||"#fff");n.circle.classList.toggle("path",p);n.circle.classList.toggle("group",g);n.circle.classList.toggle("muted",!!c&&!g&&!p);});s.avatars.forEach(a=>{a.button.classList.toggle("selected",a.m.id===s.selected);a.button.classList.toggle("muted",!!c&&a.c!==c);});}

    function startTracking(){const tick=()=>{if(s.playing)s.avatars.forEach(center);s.trackingFrame=requestAnimationFrame(tick);};s.trackingFrame=requestAnimationFrame(tick);}
    function center(item,force=false){const centers=item.m.skeleton?.center_track,duration=item.viewer.duration;if(!centers?.length||!Number.isFinite(duration)||duration<=0)return;const progress=((item.viewer.currentTime%duration)+duration)%duration/duration,index=Math.min(centers.length-1,Math.round(progress*(centers.length-1)));if(!force&&index===item.centerIndex)return;item.centerIndex=index;const [x,y,z]=centers[index];item.viewer.setAttribute("camera-target",`${x}m ${y}m ${z}m`);item.viewer.jumpCameraToGoal?.();}
    function calibrate(item){const c=item.m.skeleton?.calibration_center,centers=item.m.skeleton?.center_track,duration=item.viewer.duration;if(!c?.length||!centers?.length||!Number.isFinite(duration)||duration<=0){center(item,true);return;}const progress=clamp(item.viewer.currentTime/duration,0,1);item.centerIndex=Math.min(centers.length-1,Math.round(progress*(centers.length-1)));item.viewer.setAttribute("camera-target",`${c[0]}m ${c[1]}m ${c[2]}m`);}
    function togglePlay(){s.playing=!s.playing;s.avatars.forEach(a=>{a.viewer.timeScale=SPEED;s.playing?a.viewer.play?.():a.viewer.pause?.();});el.play.textContent=s.playing?"Pause all":"Play all";el.play.setAttribute("aria-pressed",String(s.playing));}
    function toggleLabels(){s.labels=!s.labels;el.app.classList.toggle("hide-labels",!s.labels);el.labels.textContent=s.labels?"Hide labels":"Show labels";el.labels.setAttribute("aria-pressed",String(s.labels));}
    function record(failed){failed?s.failed++:s.loaded++;el.summary.innerHTML=`<strong>${s.loaded} / 59 avatars</strong>${s.failed?` · ${s.failed} failed`:" · 3× playback"}`;}
    function convexHull(points){
      const sorted=points.map(p=>({x:p.x,z:p.z})).sort((a,b)=>a.x-b.x||a.z-b.z),cross=(o,a,b)=>(a.x-o.x)*(b.z-o.z)-(a.z-o.z)*(b.x-o.x),lower=[],upper=[];
      sorted.forEach(p=>{while(lower.length>=2&&cross(lower.at(-2),lower.at(-1),p)<=0)lower.pop();lower.push(p);});
      sorted.slice().reverse().forEach(p=>{while(upper.length>=2&&cross(upper.at(-2),upper.at(-1),p)<=0)upper.pop();upper.push(p);});
      lower.pop();upper.pop();return lower.concat(upper);
    }
    function smoothHull(points,iterations){
      let result=points.slice();for(let k=0;k<iterations;k++){const next=[];result.forEach((p,i)=>{const q=result[(i+1)%result.length];next.push({x:p.x*.75+q.x*.25,z:p.z*.75+q.z*.25},{x:p.x*.25+q.x*.75,z:p.z*.25+q.z*.75});});result=next;}return result;
    }
    function curvePoints(a,b,id,isTrunk,depth,isLeader,parentHeading,childHeading){
      if(isTrunk&&depth<=STRAIGHT_TRUNK_LEVELS)return[a,b];
      const dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,length=Math.hypot(dx,dy,dz),chord=normalize3({x:dx,y:dy,z:dz}),incoming=normalize3(parentHeading||{x:0,y:1,z:0}),emergence=isLeader?.62:.3,start=normalize3({x:incoming.x*emergence+chord.x*(1-emergence),y:incoming.y*emergence+chord.y*(1-emergence),z:incoming.z*emergence+chord.z*(1-emergence)}),horizontal=Math.hypot(dx,dz),fallback=organic(`curve-axis-${id}`),perpX=horizontal>.001?-dz/horizontal:fallback.x,perpZ=horizontal>.001?dx/horizontal:fallback.z,sign=hash01(`curve-side-${id}`)<.5?-1:1,bend=length*(isTrunk?.03:.045+.045*hash01(`curve-size-${id}`))*sign,lift=length*(.016+.018*hash01(`curve-lift-${id}`)),c1={x:a.x+start.x*length*.34+perpX*bend,y:a.y+start.y*length*.34+lift,z:a.z+start.z*length*.34+perpZ*bend},c2={x:b.x-chord.x*length*.31+perpX*bend*.45,y:b.y-chord.y*length*.31+lift*.65,z:b.z-chord.z*length*.31+perpZ*bend*.45},points=[];
      for(let i=0;i<=12;i++){const t=i/12,u=1-t;points.push({x:u*u*u*a.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*b.x,y:u*u*u*a.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*b.y,z:u*u*u*a.z+3*u*u*t*c1.z+3*u*t*t*c2.z+t*t*t*b.z});}
      return points;
    }
    function normalize3(v){const length=Math.hypot(v.x,v.y,v.z)||1;return{x:v.x/length,y:v.y/length,z:v.z/length};}
    function hash01(key){let h=2166136261;for(const c of String(key)){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return(h>>>0)/4294967296;}
    function organic(key){const angle=hash01(key)*Math.PI*2;return{x:Math.cos(angle),z:Math.sin(angle)};}
    function angleDelta(a,b){return Math.atan2(Math.sin(a-b),Math.cos(a-b));}
    function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
    function round(v){return Number(v.toFixed(2));}
    function escape(v){return String(v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c]);}
  })();
  </script>
