<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An organic embedding of 59 animated Thai dance movements connected to six movement elements."
    />
    <title>Cyber Subin 2.0 — Six-Element Embedding</title>
    <link rel="stylesheet" href="/src/element-embedding.css?v=movement-names-2" />
    <script type="module" src="/vendor/model-viewer/model-viewer.min.js"></script>
  </head>
  <body>
    <main id="element-embedding" class="element-map" aria-busy="true">
      <header class="element-map__header">
        <a class="element-map__brand" href="/">CYBER SUBIN 2.0 LAB</a>
        <div class="element-map__title">
          <strong>SIX-ELEMENT EMBEDDING</strong>
          <span>THAI DANCE MOVEMENTS 01–59</span>
        </div>
        <nav class="element-map__nav" aria-label="View navigation">
          <button id="toggle-animation" type="button" aria-pressed="true">PAUSE ALL</button>
          <button id="toggle-links" type="button" aria-pressed="true">HIDE LINKS</button>
          <button id="toggle-line-style" type="button" aria-pressed="true">CURVED LINES</button>
          <a href="/">SINGLE</a>
          <a href="/grid.html">GRID</a>
          <a class="active" href="/element-embedding.html" aria-current="page">ELEMENT MAP</a>
          <a href="/element-embedding-3d.html">3D MAP</a>
        </nav>
      </header>

      <section id="embedding-stage" class="embedding-stage" aria-label="Organic six-element dance embedding">
        <svg id="network" class="embedding-network" role="img" aria-labelledby="network-title network-description">
          <title id="network-title">Thai dance movement embedding connected to six movement elements</title>
          <desc id="network-description">Fifty-nine animated movement nodes occupy an organically warped version of their two-dimensional embedding positions. Curved line color identifies one of six elements and line width is normalized within that element.</desc>
          <g id="connections"></g>
          <g id="element-nodes"></g>
        </svg>

        <div id="avatar-layer" class="avatar-layer" aria-label="59 animated Thai dance movements"></div>

        <aside class="embedding-display-controls" aria-label="Avatar display controls">
          <label for="embedding-avatar-size">
            <span>AVATAR SIZE</span>
            <output id="embedding-avatar-size-value" for="embedding-avatar-size">100%</output>
          </label>
          <input id="embedding-avatar-size" type="range" min="50" max="180" value="100" step="5" disabled />
          <label for="embedding-avatar-spread">
            <span>AVATAR SPREAD</span>
            <output id="embedding-avatar-spread-value" for="embedding-avatar-spread">100%</output>
          </label>
          <input id="embedding-avatar-spread" type="range" min="70" max="180" value="100" step="5" disabled />
        </aside>

        <aside id="selection-panel" class="selection-panel" aria-live="polite">
          <span class="selection-panel__eyebrow">MOVEMENT EMBEDDING</span>
          <strong>HOVER A DANCE OR ELEMENT</strong>
          <p>Each color is normalized within its element to reveal variation.</p>
        </aside>

        <div id="loading-state" class="loading-state" role="status" aria-live="polite">
          <span></span>
          <strong id="loading-label">LOADING EMBEDDING</strong>
        </div>

        <div id="error-state" class="error-state" hidden>
          <strong>THE ELEMENT MAP COULD NOT LOAD</strong>
          <span id="error-message"></span>
        </div>
      </section>
    </main>

    <script type="module" src="/src/element-embedding.js?v=movement-names-1"></script>
  </body>
</html>
